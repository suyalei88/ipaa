name: Build IPA

# ============================================================
#  在没有 Mac 的机器上打包 iOS App。
#  在 GitHub 上点一下 → 云端 macOS runner 编译 → 下载 .ipa
#
#  用法：
#    1. 把 leapmotor-thirdparty/ 作为一个 GitHub 仓库推上去
#    2. 仓库页 → Actions → Build IPA → Run workflow
#    3. 跑完在本次 run 页面底部 Artifacts 里下载
#         · LeapmotorLite-unsigned-ipa   ← 未签名 IPA（用 Sideloadly 装）
#         · LeapmotorLite-app-bundle     ← .app 目录（备用）
#
#  想要 CI 里直接签名的，见文末注释里的 signing 相关说明。
# ============================================================

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'client/**'
      - 'requirements*.txt'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  # ---------- 先跑纯 Python 的算法回归（秒级，失败就不用编译了）----------
  vectors:
    name: 算法向量回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 依赖清单见 requirements.txt。
        # 注意：不要把 requirements-recon.txt 装进来（capstone/lief/numpy/gmssl
        # 只给逆向侦察脚本用，CI 不跑那些）。
        run: pip install --quiet -r requirements.txt

      - name: Swift 陷阱静态检查
        # 拦截「只能靠真机编译/运行才发现」的坑（R1~R13）：
        #   R1 URLComponents 拼 URL（'+' 不转义 → 1019）
        #   R2 [CFString: Any]     R3 foregroundStyle(.自定义色)
        #   R4 三元两分支类型不同   R5 withUnsafe 闭包独占访问
        #   R6 括号不平衡          R7 同名 static 重复声明
        #   R8 SecureField 挂 .oneTimeCode（短信验证码会被自动填进去）
        #   R9 读依赖当前时间的锁定状态却没挂 .lmClock（倒计时冻住/按钮永远禁用）
        #   R10 用了 MapKit / CoreLocation / UIKit / CoreBluetooth 的符号却没 import
        #   R11 CoreBluetooth delegate 回调写 @Published 却没保证主线程
        #   R12 局部变量遮蔽同文件的方法名（报「cannot call value of non-function type」）
        #   R13 Text(...) 里超过 3 个 `+` 拼接 → Swift 类型检查器超时
        #       （2026-10-08 真烧过一轮：ControlPanelView.swift:595 报
        #        "unable to type-check this expression in reasonable time"）
        run: python3 ios/tools/lint_swift.py

      - name: 生成 App 图标（校验脚本可跑）
        run: python ios/tools/make_icon.py

      - name: 校验 Swift 自测向量
        run: python client/test_swift_vectors.py

      - name: 校验坐标系换算（WGS-84 ↔ GCJ-02）
        # 不属于加解密，但同样是「算错了整页定位就偏几百米」的纯算法。
        # 做两件事：
        #   1. 用独立实现的 GCJ-02 算法比对参考向量（合肥点 / 全国 6 点 / 境外点）
        #   2. 回头读 API/LMCoordinate.swift 的源码文本，确认常量、迭代反解、
        #      三个校正选项、以及「默认值不是 .none」都还在
        #      —— 默认值被改成 .none 等于这个 bug 没修，所以专门钉住。
        run: python client/test_coord_vectors.py

      - name: HAR 签名回归（期望 101/105）
        run: python client/test_sign_regression.py || true

      # gen_xcodeproj.py --check 做三件事：
      #   1. 结构自检（括号平衡 + UUID 闭合）
      #   2. 跨平台确定性自测（UUID 金标，抓 rel 分隔符 / md5 前缀被改）
      #   3. 与磁盘 project.pbxproj 逐字节比对
      # 第 3 条是防「新增 .swift 却忘了重新生成工程」——那种情况下
      # build 会「成功」，但新文件根本没进 Sources phase，功能静默缺失。
      #
      # ⚠️ 这个 job 跑在 ubuntu 上，而 pbxproj 通常在 Windows 上生成。
      #    生成器里 rel 必须用 '/' 不能用 os.path.join，否则两边 UUID 不一致，
      #    这里会红。金标自测就是专门钉这一点的。
      - name: Xcode 工程生成自检
        run: python ios/tools/gen_xcodeproj.py --check

  # ---------- 真正的 iOS 编译 ----------
  build:
    name: 编译未签名 IPA
    needs: vectors
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcode-select -p
          python3 --version
          sw_vers

      - name: 校验图标已就位
        # 图标（icon-1024.png + 两个 Contents.json）已随仓库提交，
        # 所以 build job 不需要 PIL —— make_icon.py 的正确性由 vectors job 验证。
        # 这里只确认资产存在且尺寸正确，避免把错误推迟到 xcodebuild 才暴露。
        run: |
          ICON="ios/LeapmotorLite/LeapmotorLite/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::error::缺少 $ICON —— 本地跑 python3 ios/tools/make_icon.py 后提交"
            exit 1
          fi
          sips -g pixelWidth -g pixelHeight "$ICON"

      - name: 构建 IPA
        # 同时 tee 一份到 $RUNNER_TEMP/build.log，供下面的「失败摘要」步骤取用。
        # `set -o pipefail` 保证 build_ipa.sh 失败时这一步也失败（否则 tee 会
        # 把退出码盖成 0，构建挂了 CI 却绿）。
        run: |
          set -o pipefail
          bash ios/build_ipa.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: 构建失败时把编译错误写进摘要
        # ★ 为什么要有这一步：
        #   GitHub 的 job 日志接口会 302 到 Azure Blob
        #   （productionresultssa*.blob.core.windows.net）。在受限网络里那个域
        #   拿不到，于是「CI 红了但看不到为什么」—— 2026-10-08 就卡在这上面。
        #   而 job summary 走 api.github.com（可读），所以把关键错误搬过来。
        #   当时真凶是 R13：
        #     ControlPanelView.swift:595:9: error: the compiler is unable to
        #     type-check this expression in reasonable time
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          {
            echo "### 构建失败"
            echo ""
            echo '```'
            if [ -f "$LOG" ]; then
              grep -E "error:|note: |The following build commands failed|BUILD FAILED" "$LOG" \
                | head -80 || true
              if ! grep -q "error:" "$LOG"; then
                echo "（日志里没有 error: 行，下面给最后 60 行）"
                tail -60 "$LOG"
              fi
            else
              echo "（没找到 $LOG）"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验构建指纹已注入
        # ★ 为什么要有这一步：2026-10-07 出过一版包，版本号还是 1.0.0 (1)、
        #   包里也没有任何构建标识，用户装完说「跟上个版本一样」，
        #   我们只能把两个 IPA 产物都下下来比对二进制字符串才知道谁是谁。
        #   现在 build_ipa.sh 会把 git 提交号注进 Info.plist，这里确认它**真的被替换了**
        #   （没替换的话 plist 里会留着字面量 `$(LM_GIT_SHA)`）。
        run: |
          PLIST="ios/LeapmotorLite/build/Build/Products/Release-iphoneos/LeapmotorLite.app/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BLD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          SHA=$(/usr/libexec/PlistBuddy -c 'Print :LMGitSHA' "$PLIST")
          TIM=$(/usr/libexec/PlistBuddy -c 'Print :LMBuildTime' "$PLIST")
          echo "版本 $VER ($BLD)   指纹 $SHA @ $TIM"
          echo "### 构建标识" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VER ($BLD) · $SHA @ $TIM\`" >> "$GITHUB_STEP_SUMMARY"

          # 没替换的话 plist 里会留着字面量 $(LM_GIT_SHA)
          if [[ "$SHA" == '$('* ]]; then
            echo "::error::LMGitSHA 没被替换（仍是 $SHA）—— xcodebuild 没收到 LM_GIT_SHA"
            exit 1
          fi
          if [[ -z "$SHA" ]]; then
            echo "::error::LMGitSHA 为空"
            exit 1
          fi
          if [[ "$VER" == "1.0.0" && "$BLD" == "1" ]]; then
            echo "::warning::版本号仍是初始的 1.0.0 (1)，记得改 Support/Info.plist 与 LMBuildInfo.tag"
          fi

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: LeapmotorLite-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传 .app（备用 / 便于检查结构）
        uses: actions/upload-artifact@v4
        with:
          name: LeapmotorLite-app-bundle
          path: ios/LeapmotorLite/build/Build/Products/Release-iphoneos/LeapmotorLite.app
          if-no-files-found: warn
          retention-days: 14

      - name: 打印产物摘要
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/
          echo "" >> "$GITHUB_STEP_SUMMARY"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            ios/LeapmotorLite/build/Build/Products/Release-iphoneos/LeapmotorLite.app/Info.plist \
            | sed 's/^/CFBundleIdentifier: /' >> "$GITHUB_STEP_SUMMARY"

