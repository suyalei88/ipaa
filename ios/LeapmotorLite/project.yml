# XcodeGen 工程描述 —— 一键生成 Xcode 工程
#
#   brew install xcodegen
#   cd ios/LeapmotorLite && xcodegen generate
#   open LeapmotorLite.xcodeproj
#
# 不想装 XcodeGen 也可以按 README 里的「手动建工程」步骤做。

name: LeapmotorLite

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LeapmotorLite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LeapmotorLite
        excludes:
          - "Support/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.leapmotorlite
        PRODUCT_NAME: LeapmotorLite
        INFOPLIST_FILE: LeapmotorLite/Support/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: ""
        # CommonCrypto 由系统提供，无需额外链接
        OTHER_LDFLAGS: ""
    info:
      path: LeapmotorLite/Support/Info.plist
